<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Army LMS</title>
  <link rel="icon" type="image/x-icon" href="./css/graduation-cap-solid.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f2f5f2;
    }

    /* ── Left brand panel ── */
    .login-brand {
      width: 400px;
      flex-shrink: 0;
      background: #071a0f;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 44px 44px 40px;
      position: relative;
      overflow: hidden;
    }

    /* Large watermark for depth */
    .login-brand::after {
      content: 'LMS';
      position: absolute;
      bottom: -28px;
      right: -12px;
      font-size: 196px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.028);
      line-height: 1;
      letter-spacing: -8px;
      pointer-events: none;
      user-select: none;
      font-family: 'Outfit', sans-serif;
    }

    .brand-top {
      position: relative;
      z-index: 1;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: rgba(52, 168, 83, 0.12);
      border: 1px solid rgba(52, 168, 83, 0.22);
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #5bd47e;
      margin-bottom: 32px;
    }

    .brand-eyebrow {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.32);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .brand-name {
      font-size: 52px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -2.5px;
      line-height: 0.95;
      margin-bottom: 20px;
    }

    .brand-desc {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.42);
      line-height: 1.7;
      max-width: 256px;
    }

    .brand-bottom {
      position: relative;
      z-index: 1;
      padding-top: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }

    .brand-stats {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .stat-row {
      display: flex;
      align-items: baseline;
      gap: 11px;
    }

    .stat-num {
      font-size: 17px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.88);
      min-width: 42px;
      font-variant-numeric: tabular-nums;
    }

    .stat-desc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.38);
    }

    /* ── Right form panel ── */
    .login-form-side {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      background: #f2f5f2;
    }

    .login-theme-toggle {
      position: absolute;
      top: 24px;
      right: 24px;
    }

    .login-form-wrap {
      width: 100%;
      max-width: 372px;
      animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-form-wrap { animation: none; }
    }

    .login-greeting {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }

    .login-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .login-error {
      background: #fef2f2;
      color: #dc2626;
      padding: 11px 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      border: 1px solid #fecaca;
      font-size: 13.5px;
    }

    .login-error.show { display: flex; }

    .form-field {
      margin-bottom: 18px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 7px;
      display: block;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i.input-ico {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 13px;
      pointer-events: none;
    }

    .input-wrap .form-control {
      padding-left: 40px;
      height: 46px;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Outfit', sans-serif;
      border: 1.5px solid var(--border);
      background: var(--input-bg);
      color: var(--text-primary);
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    .input-wrap .form-control::placeholder {
      color: var(--text-muted);
      font-size: 13.5px;
    }

    .input-wrap .form-control:focus {
      border-color: #34a853;
      box-shadow: 0 0 0 3px rgba(52, 168, 83, 0.1);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 13px;
      transition: color 0.15s;
    }

    .password-toggle:hover { color: var(--text-primary); }

    .btn-login {
      width: 100%;
      height: 46px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      border-radius: 10px;
      background: #34a853;
      color: #ffffff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-login:hover { background: #2d9647; }
    .btn-login:active { transform: scale(0.985); }
    .btn-login:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── Dark mode ── */
    [data-theme="dark"] .login-brand {
      background: #040e07;
    }

    [data-theme="dark"] .login-form-side {
      background: #0f172a;
    }

    [data-theme="dark"] .login-error {
      background: rgba(220, 38, 38, 0.1);
      border-color: rgba(220, 38, 38, 0.3);
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .login-brand { display: none; }

      .login-form-side {
        background: #f2f5f2;
        min-height: 100dvh;
        align-items: flex-start;
        padding-top: 80px;
      }

      [data-theme="dark"] .login-form-side { background: #0f172a; }
    }
  </style>
</head>

<body>
  <!-- Left brand panel -->
  <div class="login-brand">
    <div class="brand-top">
      <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
      <div class="brand-eyebrow">Army Tech</div>
      <div class="brand-name">Army<br>LMS</div>
      <div class="brand-desc">Hệ thống quản lý học tập dành cho trung tâm Anh ngữ</div>
    </div>

    <div class="brand-bottom">
      <div class="brand-stats">
        <div class="stat-row">
          <span class="stat-num">10+</span>
          <span class="stat-desc">chi nhánh trên toàn quốc</span>
        </div>
        <div class="stat-row">
          <span class="stat-num">5K+</span>
          <span class="stat-desc">học viên đang theo học</span>
        </div>
        <div class="stat-row">
          <span class="stat-num">100+</span>
          <span class="stat-desc">nhân sự và giáo viên</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="login-form-side">
    <button class="theme-toggle login-theme-toggle" onclick="theme.toggle()" title="Đổi giao diện">
      <i class="fas fa-moon"></i>
      <i class="fas fa-sun"></i>
    </button>

    <div class="login-form-wrap">
      <div class="login-greeting">Chào mừng trở lại</div>
      <div class="login-sub">Đăng nhập để tiếp tục làm việc</div>

      <div id="errorMsg" class="login-error">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText"></span>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-field">
          <label class="form-label" for="usernameInput">Tên đăng nhập</label>
          <div class="input-wrap">
            <i class="fas fa-user input-ico"></i>
            <input
              type="text"
              id="usernameInput"
              name="username"
              class="form-control"
              placeholder="Nhập username"
              required
              autofocus
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-field">
          <label class="form-label" for="passwordInput">Mật khẩu</label>
          <div class="input-wrap">
            <i class="fas fa-lock input-ico"></i>
            <input
              type="password"
              name="password"
              id="passwordInput"
              class="form-control"
              placeholder="Nhập mật khẩu"
              required
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle" onclick="togglePassword()">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">
          <i class="fas fa-right-to-bracket"></i> Đăng nhập
        </button>
      </form>

      <div class="login-footer">By Vietld</div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js?v=4.1"></script>
  <script>
    if (auth.isLoggedIn()) window.location.href = 'index.html';

    function togglePassword() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      icon.className = isText ? 'fas fa-eye' : 'fas fa-eye-slash';
    }

    function showError(msg) {
      document.getElementById('errorText').textContent = msg;
      document.getElementById('errorMsg').classList.add('show');
    }
    function hideError() {
      document.getElementById('errorMsg').classList.remove('show');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('btnLogin');
      const username = document.querySelector('[name="username"]').value.trim();
      const password = document.querySelector('[name="password"]').value;

      if (!username) { showError('Vui lòng nhập tên đăng nhập'); return; }
      if (!password) { showError('Vui lòng nhập mật khẩu'); return; }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang đăng nhập...';

      try {
        const result = await auth.login(username, password);
        if (result.success) {
          btn.innerHTML = '<i class="fas fa-check"></i> Thành công!';
          btn.style.background = '#16a34a';
          setTimeout(() => window.location.href = 'index.html', 500);
        }
      } catch (error) {
        showError(error.message || 'Sai tên đăng nhập hoặc mật khẩu');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Đăng nhập';
      }
    });
  </script>
</body>

</html>
